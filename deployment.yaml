# Converted from Deployment to Rollout (Phase 2, #1805) to deploy via
# canary with automated rollback, per docs/DEPLOYMENT_STRATEGY.md's
# Canary-over-Blue/Green decision and the tracer-bullet-canary-success
# AnalysisTemplate (platform/apps/tracer-bullet/tracer-bullet-analysis-template.yaml
# in the fawkes repo, both merged in #1805's earlier batch).
#
# Basic (replica-ratio) canary, no trafficRouting plugin: this cluster has
# no service-mesh/ingress-controller wired for weighted traffic splitting
# to Argo Rollouts yet, so the existing single Service continues to select
# both stable and canary ReplicaSets by label - traffic splits
# approximately by replica count ratio, not exact request-level weighting.
# At only 2 replicas, 10%/50%/100% steps (docs/DEPLOYMENT_STRATEGY.md's
# aspirational figures) aren't meaningfully distinct - ceil(0.1*2)=1 canary
# replica is already a 50% split. Using 50%/100% steps instead, which ARE
# achievable exactly at this replica count. Revisit with finer steps once
# replica count or a traffic-routing plugin makes 10% actually mean 10%.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: tracer-bullet
  namespace: fawkes
  labels:
    app: tracer-bullet
    version: v0.1.0
    app.kubernetes.io/name: tracer-bullet
    app.kubernetes.io/version: v0.1.0
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: fawkes
    app.kubernetes.io/managed-by: argocd
    team: platform-team
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tracer-bullet
  strategy:
    canary:
      analysis:
        templates:
          - templateName: tracer-bullet-canary-success
        args:
          - name: service-name
            value: tracer-bullet
          - name: namespace
            value: fawkes
      steps:
        - setWeight: 50
        - pause:
            duration: 60s
        - setWeight: 100
  template:
    metadata:
      labels:
        app: tracer-bullet
        app.kubernetes.io/name: tracer-bullet
        app.kubernetes.io/version: v0.1.0
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: fawkes
        team: platform-team
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tracer-bullet
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: tracer-bullet
          image: ghcr.io/paruff/tracer-bullet:95a552d
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "tracer-bullet"
            - name: DEPLOYMENT_ENVIRONMENT
              value: "development"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
